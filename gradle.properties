# Project-wide Gradle settings.
# 2g: on-device builds (AndroidIDE) thrash above this; PC builds can raise it.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspath=true

# KSP
ksp.incremental=true
ksp.incremental.interop=true

# R8 / D8

# Jetifier (not needed for androidx-only but safe)
android.enableJetifier=true

# Build cache
org.gradle.caching=true
android.buildCache.size=5g

# Compose compiler
android.experimental.enableComposeCompilerReports=false
