<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Jinka — Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/transitions.css">
<link rel="stylesheet" href="css/loader.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.2.1/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.2.1/dist/ionicons/ionicons.js"></script>
</head>
<body data-page="search">

<!-- ===== LOADING SCREEN (brief, masks the page-transition seam).
     Lives OUTSIDE .app-shell so the shell's enter animation
     (opacity 0 -> 1) can never dim or flash it. ===== -->
<div class="jinka-loader" aria-hidden="true">
  <div class="jinka-loader-badge">
    <div class="jinka-loader-ring"></div>
    <img class="jinka-loader-mark" src="img/ic_notification.png" alt="" draggable="false">
  </div>
</div>

<div class="app-shell">

  <header class="app-header">
    <span class="header-title">Search</span>
  </header>

  <main class="app-main search-main">

    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="search-bar-icon">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input id="searchInput" class="search-bar-input" type="search" placeholder="Search for a song…" autocomplete="off" enterkeyhint="search">
    </div>

    <p class="search-hint" id="searchHint">Tap a result to preview it. Double-tap to save it offline.</p>

    <div class="search-results" id="searchResults"></div>

  </main>

  <!-- ===== MINI PLAYER (currently previewing search result) ===== -->
  <div class="mini-player" id="miniPlayer" hidden>
    <div class="mini-player-thumb" id="miniPlayerThumb">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="mini-player-body">
      <div class="mini-player-title" id="miniPlayerTitle">&nbsp;</div>
      <div class="mini-player-artist" id="miniPlayerArtist">&nbsp;</div>
    </div>
    <button class="mini-player-play" id="miniPlayerToggle" aria-label="Pause" aria-pressed="true">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
  </div>

  <!-- ===== BOTTOM NAVIGATION ===== -->
  <nav class="bottom-nav" aria-label="Primary">
    <a class="nav-item" href="index.html" aria-label="Home">
      <ion-icon name="planet-outline"></ion-icon>
    </a>
    <a class="nav-item" href="search.html" aria-current="page" aria-label="Search">
      <ion-icon name="search-outline"></ion-icon>
    </a>
    <a class="nav-item" href="library.html" aria-label="Library">
      <ion-icon name="musical-note-outline"></ion-icon>
    </a>
    <a class="nav-item" href="user.html" aria-label="User">
      <ion-icon name="person-outline"></ion-icon>
    </a>
  </nav>

</div>


<script src="js/page-transitions.js"></script>
<script src="js/nav-transitions.js"></script>
<script src="js/page-loader.js"></script>
<script src="js/sleep-timer.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
