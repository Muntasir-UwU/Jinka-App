<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Jinka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/transitions.css">
<link rel="stylesheet" href="css/loader.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.2.1/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.2.1/dist/ionicons/ionicons.js"></script>
</head>
<body data-page="home">

<!-- ===== LOADING SCREEN (brief, masks the page-transition seam).
     Lives OUTSIDE .app-shell so the shell's enter animation
     (opacity 0 -> 1) can never dim or flash it. ===== -->
<div class="jinka-loader" aria-hidden="true">
  <div class="jinka-loader-badge">
    <div class="jinka-loader-ring"></div>
    <img class="jinka-loader-mark" src="img/ic_notification.png" alt="" draggable="false">
  </div>
</div>

<div class="app-shell">

  <!-- ===== AMBIENT BACKGROUND ===== -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-blob ambient-blob-1"></div>
    <div class="ambient-blob ambient-blob-2"></div>
    <div class="ambient-blob ambient-blob-3"></div>
  </div>

  <!-- ===== TOP BAR ===== -->
  <header class="app-header">
    <span class="header-title">Now Playing</span>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="app-main">

    <!-- ALBUM ARTWORK -->
    <div class="artwork-wrap">
      <div class="artwork" aria-hidden="true">
        <img class="artwork-img" id="artworkImg" alt="" draggable="false">
        <span class="artwork-mark">JINKA</span>
      </div>
    </div>

    <!-- SONG INFO ROW -->
    <div class="track-row">
      <div class="track-info">
        <h1 class="track-title">Unsayable</h1>
        <p class="track-artist">Brambles</p>
      </div>
    </div>

    <!-- WAVEFORM / PROGRESS -->
    <div class="waveform-block">
      <div class="waveform" id="waveform" role="img" aria-label="Playback progress waveform"></div>
      <div class="progress-times">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
    </div>

    <!-- PLAYER CONTROLS -->
    <div class="controls">
      <button class="ctrl-btn ctrl-mini" id="lyricsToggle" aria-label="Lyrics" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16"/><path d="M4 11h10"/><path d="M4 16h13"/><path d="M4 21h7"/>
        </svg>
      </button>

      <button class="ctrl-btn ctrl-nav" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>
      </button>

      <button class="ctrl-btn ctrl-play" id="playToggle" aria-label="Play" aria-pressed="false">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>

      <button class="ctrl-btn ctrl-nav" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l11-6z"/></svg>
      </button>

      <button class="ctrl-btn ctrl-mini" id="repeatBtn" aria-label="Repeat" aria-pressed="false" data-mode="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <span class="repeat-one-badge" aria-hidden="true">1</span>
      </button>
    </div>

  </main>

  <!-- ===== BOTTOM NAVIGATION ===== -->
  <nav class="bottom-nav" aria-label="Primary">
    <a class="nav-item" href="index.html" aria-current="page" aria-label="Home">
      <ion-icon name="planet-outline"></ion-icon>
    </a>
    <a class="nav-item" href="search.html" aria-label="Search">
      <ion-icon name="search-outline"></ion-icon>
    </a>
    <a class="nav-item" href="library.html" aria-label="Library">
      <ion-icon name="musical-note-outline"></ion-icon>
    </a>
    <a class="nav-item" href="user.html" aria-label="User">
      <ion-icon name="person-outline"></ion-icon>
    </a>
  </nav>

</div>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

<!-- ===== LYRICS SHEET ===== -->
<section class="sheet" id="lyricsSheet" aria-hidden="true">
  <div class="sheet-handle"></div>
  <header class="sheet-header">
    <span class="sheet-title" id="lyricsTrackTitle">Lyrics</span>
    <button class="icon-btn sheet-close" id="lyricsClose" aria-label="Close lyrics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </header>
  <div class="sheet-body lyrics-body" id="lyricsList"></div>
</section>


<script src="js/page-transitions.js"></script>
<script src="js/nav-transitions.js"></script>
<script src="js/page-loader.js"></script>
<script src="js/sleep-timer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
