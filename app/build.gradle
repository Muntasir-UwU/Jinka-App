plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    // Version comes from the root build.gradle (4.4.2 — VERIFY LATEST).
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.jinki.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jinki.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        multiDexEnabled true
        
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        // Release credentials live ONLY in ~/.gradle/gradle.properties
        // (auto-loaded by Gradle as project properties) or as environment
        // variables — never hardcoded, never committed. Expected keys:
        //   JINKI_KEYSTORE_PATH      absolute path to the .jks file
        //   JINKI_KEYSTORE_PASSWORD  password for the keystore
        //   JINKI_KEY_ALIAS          alias of the upload key
        //   JINKI_KEY_PASSWORD       password for the key
        release {
            def path = System.getenv("JINKI_KEYSTORE_PATH") ?: findProperty("JINKI_KEYSTORE_PATH")
            if (path != null) {
                storeFile file(path)
                storePassword System.getenv("JINKI_KEYSTORE_PASSWORD") ?: findProperty("JINKI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("JINKI_KEY_ALIAS") ?: findProperty("JINKI_KEY_ALIAS")
                keyPassword System.getenv("JINKI_KEY_PASSWORD") ?: findProperty("JINKI_KEY_PASSWORD")
            } else {
                println("WARNING: no release keystore configured (~/.gradle/gradle.properties or JINKI_KEYSTORE_* env); release will be debug-signed. See README.")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjvm-default=all',
            '-Xskip-prerelease-check',
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=kotlinx.coroutines.FlowPreview'
        ]
    }

    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += ['META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
        jniLibs {
            pickFirsts += ['libc++_shared.so']
        }
    }

}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.2'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'

    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'io.coil-kt:coil-compose:2.6.0'

    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'

    // Firebase. The BoM pins auth/database/functions to mutually
    // compatible versions — only the BoM carries a version number.
    // VERIFY LATEST: confirm 33.4.0 is still the newest in the Firebase Android release notes.
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.03')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    
    androidTestImplementation 'androidx.benchmark:benchmark-macro-junit4:1.2.4'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}